name: Generate Digimon GLB assets
on:
  push:
    paths:
      - 'tools/generate_digimon_glb.py'
      - 'tools/blender_generate_gabumon.py'
      - 'tools/postprocess_digimon_glb.py'
      - '.github/workflows/generate-glb-assets.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 3D
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Generate base assets
        run: |
          python tools/generate_digimon_glb.py
          python tools/postprocess_digimon_glb.py
      - name: Rebuild Gabumon with Blender
        run: |
          blender -b --factory-startup --python tools/blender_generate_gabumon.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/digimon/*.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild Gabumon with Blender organic 3D modeling'
          git push
