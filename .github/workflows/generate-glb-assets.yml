name: Generate Digimon GLB assets
on:
  push:
    paths:
      - 'tools/generate_digimon_glb.py'
      - 'tools/generate_biyomon_better.py'
      - 'tools/postprocess_digimon_glb.py'
      - '.github/workflows/generate-glb-assets.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install 3D generator
        run: python -m pip install trimesh numpy scipy pygltflib
      - name: Generate high quality GLB files
        run: |
          python tools/generate_digimon_glb.py
          python tools/generate_biyomon_better.py
          python tools/postprocess_digimon_glb.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/digimon/*.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Improve all Digimon 3D models'
          git push
